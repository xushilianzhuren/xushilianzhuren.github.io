<script>
function submitClaim(){
  var prod=document.getElementById('prod').value;
  var amt=document.getElementById('amt').value;
  var ct=document.getElementById('contact').value.trim();
  var note=document.getElementById('note').value.trim();
  var msg=document.getElementById('msg');
  if(!prod||!amt||!ct){msg.style.display='block';msg.className='err';msg.textContent='请填齐：商品、实付金额、联系方式';return;}
  var payload=JSON.stringify({type:'claim',prod:prod,amount:amt,contact:ct,note:note,ts:Date.now()});
  fetch('http://101.96.224.80/pay/ingest?token=zk2026',{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:payload}).then(function(){
    msg.style.display='block';msg.className='ok';
    msg.innerHTML='✅ 申报已提交！我们核对到账后，24小时内通过您的联系方式发货。急单直接微信 15967404693 催单。';
    document.getElementById('prod').value='';document.getElementById('amt').value='';document.getElementById('contact').value='';document.getElementById('note').value='';
  }).catch(function(){
    msg.style.display='block';msg.className='err';
    msg.textContent='网络异常？请直接加微信 15967404693 发"我买了XX"同样有效。';
  });
}
