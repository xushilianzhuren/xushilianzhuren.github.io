<script>function zsToggle(){var h=document.documentElement,d=h.getAttribute('data-theme')==='dark'?'light':'dark';h.setAttribute('data-theme',d);localStorage.setItem('zs_theme',d);var b=document.getElementById('zsTB');if(b)b.textContent=d==='dark'?'☀️':'🌙';}

<div class="wrap">
  <header><h1>留言板</h1><p>需求单：想要什么·预算多少·要什么功能——一条提交，帝国接单。</p></header>
  <div class="board">
        <textarea id="desc" placeholder="描述：想要的东西具体长什么样？拿它干什么用？（必填）"></textarea>
    <textarea id="features" placeholder="预期功能：具体要哪些功能点？一条一条写" style="min-height:70px;"></textarea>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;">
      <input id="type" placeholder="想要/希望（如：工具/APP/脚本/书）" style="flex:1;min-width:150px;padding:10px;border:1px solid #ccc;border-radius:6px;font-size:14px;">
      <input id="price" placeholder="预期价格（如：50以内/100-500）" style="flex:1;min-width:150px;padding:10px;border:1px solid #ccc;border-radius:6px;font-size:14px;">
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;">
      <input id="help" placeholder="能帮忙做什么（如：试用反馈/推广/供应商）" style="flex:1;min-width:150px;padding:10px;border:1px solid #ccc;border-radius:6px;font-size:14px;">
      <input id="contact" placeholder="联系方式（微信号，选填）" style="flex:1;min-width:150px;padding:10px;border:1px solid #ccc;border-radius:6px;font-size:14px;">
    </div>
    <button onclick="send()">提交需求单</button>
    <div class="msg" id="msg"></div>
    <h3>最新留言</h3>
    <div id="list"><div class="fb" style="color:#999;">加载中…</div></div>
  </div>
  <div class="contact"><b>急事直联</b><br>微信：15967404693（同手机号）· QQ：852456426</div>
  <a class="home" href="index.html">← 首页</a> · <a class="home" href="recycle.html">回收专区 →</a>

</div>
<script>
function esc(s){return s.replace(/</g,'&lt;');}
async function load(){
  try{
    const r = await fetch('/api/fb'); const d = await r.json();
    document.getElementById('list').innerHTML = d.length ? d.slice().reverse().map(x=>`<div class="fb">${esc(x.text)}<div class="t">${x.t}</div></div>`).join('') : '<div class="fb" style="color:#999;">还没有留言，坐第一把交椅。</div>';
  }catch(e){ document.getElementById('list').innerHTML='<div class="fb" style="color:#999;">加载失败，稍后再试。</div>'; }
}
async function send(){
  const m = document.getElementById('msg'); const b = document.querySelector('button');
  const g = id => document.getElementById(id).value.trim();
  if(!g('desc')){ m.textContent='描述不能为空。'; return; }
  b.disabled = true; m.textContent='提交中…';
  try{
    const r = await fetch('/api/fb', {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({type:g('type'),price:g('price'),features:g('features'),desc:g('desc'),help:g('help'),contact:g('contact')})});
    const d = await r.json();
    if(d.ok){ m.textContent='需求单已收到，帝国会看到。'; ['type','price','features','desc','help'].forEach(id=>document.getElementById(id).value=''); load(); }
    else m.textContent='提交失败，请微信直联。';
  }catch(e){ m.textContent='网络问题，请微信直联：15967404693'; }
  b.disabled = false;
}
load();
</script>
